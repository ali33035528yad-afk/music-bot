name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o MusicNo_Android_Project-1.zip -d android-project

      - name: Make gradlew executable
        run: |
          find android-project -name gradlew -type f -exec chmod +x {} \;

      - name: Build APK
        run: |
          cd android-project
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicBot-APK
          path: android-project/**/build/outputs/apk/**/*.apk
