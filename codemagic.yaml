workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    scripts:
      - name: Extract Android project
        script: |
          rm -rf android-project
          mkdir android-project
          unzip -o MusicNo_Android_Project-1.zip -d android-project
          echo "android.useAndroidX=true" > android-project/gradle.properties
          echo "android.enableJetifier=true" >> android-project/gradle.properties

      - name: Build APK
        script: |
          cd android-project
          gradle assembleDebug --no-daemon

    artifacts:
      - android-project/app/build/outputs/apk/**/*.apk
